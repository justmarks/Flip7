name: Android APK Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web assets and sync Capacitor
        run: npm run sync:android
        env:
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_POSTHOG_TOKEN: ${{ vars.VITE_POSTHOG_TOKEN }}

      - name: Remove flatDir from generated Capacitor plugin build file
        run: |
          FILE="Android/capacitor-cordova-android-plugins/build.gradle"
          if [ -f "$FILE" ]; then
            sed -i '/flatDir[[:space:]]*{/,/}/d' "$FILE"
          fi

      - name: Patch sentry-capacitor build.gradle for AGP 9 compatibility
        run: |
          FILE="node_modules/@sentry/capacitor/android/build.gradle"
          if [ -f "$FILE" ]; then
            sed -i 's/compileSdkVersion safeExtGet/compileSdk safeExtGet/g' "$FILE"
            sed -i 's/targetSdkVersion safeExtGet/targetSdk safeExtGet/g' "$FILE"
            sed -i 's/minSdkVersion safeExtGet/minSdk safeExtGet/g' "$FILE"
            sed -i 's/lintOptions {/lint {/g' "$FILE"
            sed -i "s/getDefaultProguardFile('proguard-android.txt')/getDefaultProguardFile('proguard-android-optimize.txt')/g" "$FILE"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin

      - name: Make Gradle wrapper executable
        run: chmod +x Android/gradlew

      - name: Get app version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > Android/app/flip7-release.jks

      - name: Build release APK
        run: ./gradlew assembleRelease
        working-directory: Android
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/Android/app/flip7-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Copy APK to workspace root
        run: cp "Android/app/build/outputs/apk/release/Flip7ScoreTracker-v${{ steps.version.outputs.version }}.apk" "Flip7ScoreTracker-v${{ steps.version.outputs.version }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: Flip7ScoreTracker-v${{ steps.version.outputs.version }}
          path: Flip7ScoreTracker-v${{ steps.version.outputs.version }}.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          APK="Flip7ScoreTracker-v${VERSION}.apk"
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists; replacing APK"
            gh release upload "$TAG" "$APK" --clobber
          else
            echo "Creating release $TAG"
            gh release create "$TAG" "$APK" \
              --title "$TAG" \
              --generate-notes
          fi
