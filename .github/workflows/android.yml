name: Android APK Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web assets and sync Capacitor
        run: npm run sync:android
        env:
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_POSTHOG_TOKEN: ${{ vars.VITE_POSTHOG_TOKEN }}

      - name: Remove flatDir from generated Capacitor plugin build file
        run: |
          FILE="Android/capacitor-cordova-android-plugins/build.gradle"
          if [ -f "$FILE" ]; then
            sed -i '/flatDir[[:space:]]*{/,/}/d' "$FILE"
          fi

      - name: Patch sentry-capacitor build.gradle for AGP 9 compatibility
        run: |
          FILE="node_modules/@sentry/capacitor/android/build.gradle"
          if [ -f "$FILE" ]; then
            sed -i 's/compileSdkVersion safeExtGet/compileSdk safeExtGet/g' "$FILE"
            sed -i 's/targetSdkVersion safeExtGet/targetSdk safeExtGet/g' "$FILE"
            sed -i 's/minSdkVersion safeExtGet/minSdk safeExtGet/g' "$FILE"
            sed -i 's/lintOptions {/lint {/g' "$FILE"
            sed -i "s/getDefaultProguardFile('proguard-android.txt')/getDefaultProguardFile('proguard-android-optimize.txt')/g" "$FILE"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin

      - name: Make Gradle wrapper executable
        run: chmod +x Android/gradlew

      - name: Get app version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > Android/app/flip7-release.jks

      - name: Build release APK
        run: ./gradlew assembleRelease
        working-directory: Android
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/Android/app/flip7-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Copy APK to workspace root
        run: cp "Android/app/build/outputs/apk/release/Flip7ScoreTracker-v${{ steps.version.outputs.version }}.apk" "Flip7ScoreTracker-v${{ steps.version.outputs.version }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: Flip7ScoreTracker-v${{ steps.version.outputs.version }}
          path: Flip7ScoreTracker-v${{ steps.version.outputs.version }}.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload APK to Google Drive
        run: |
          pip install google-api-python-client google-auth --quiet
          python3 << 'EOF'
          import json
          import os
          from google.oauth2.service_account import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          version = os.environ['APP_VERSION']
          apk_filename = f'Flip7ScoreTracker-v{version}.apk'

          sa_info = json.loads(os.environ['GDRIVE_SERVICE_ACCOUNT_JSON'])
          creds = Credentials.from_service_account_info(
              sa_info,
              scopes=['https://www.googleapis.com/auth/drive.file']
          )
          service = build('drive', 'v3', credentials=creds)

          file_metadata = {
              'name': apk_filename,
              'parents': ['1GJIeUSxSb4OhMkDGc-t3p1Hf39Jr8aiq']
          }
          media = MediaFileUpload(
              apk_filename,
              mimetype='application/vnd.android.package-archive'
          )
          result = service.files().create(
              body=file_metadata,
              media_body=media,
              fields='id,name',
              supportsAllDrives=True
          ).execute()
          print(f"Uploaded {result['name']} to Google Drive (id: {result['id']})")
          EOF
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
